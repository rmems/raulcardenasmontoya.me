name: Quality

on:
  pull_request:
  push:
    branches: [main]
  # Use Actions → Quality → Run workflow when "Re-run" is unavailable or the queue failed.
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        # v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Rust 1.99.0 with the browser target
        # 1.99.0 action revision
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Use Node.js
        # v4.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
          cache: npm
      - name: Reject git-sourced adapter dependencies
        run: node scripts/verify-lockfile-sources.mjs
      - name: Validate the locked Rust adapter
        run: |
          cargo fmt --manifest-path crates/neuromorphic-adapter/Cargo.toml --check
          cargo clippy --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked
          cargo check --manifest-path crates/neuromorphic-adapter/Cargo.toml --locked --target wasm32-unknown-unknown
      - name: Enforce browser dependency policy
        run: node scripts/verify-browser-dependencies.mjs
      - name: Install pinned wasm-bindgen CLI
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-bindgen@0.2.126
      - name: Provision stable Chrome for browser smoke coverage
        id: chrome
        # v1.7.3
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate site
        run: WASM_BINDGEN_BIN="$(command -v wasm-bindgen)" BROWSER_BIN="${{ steps.chrome.outputs.chrome-path }}" npm run validate

  coverage-report:
    name: coverage report and uploads
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Rust 1.99.0
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust LCOV
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --manifest-path crates/neuromorphic-adapter/Cargo.toml \
            --all-targets \
            --all-features \
            --locked \
            --lcov \
            --output-path coverage/rust.lcov

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Node LCOV
        run: npm run test:coverage

      - name: Retain merged coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: |
            coverage/rust.lcov
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Check Codecov upload mode
        id: codecov_token
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = 'dependabot[bot]' ] && [ -z "$CODECOV_TOKEN" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Codecov upload skipped for Dependabot without `CODECOV_TOKEN`.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$CODECOV_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'use_oidc=false' >> "$GITHUB_OUTPUT"
            echo 'Codecov upload: repository secret `CODECOV_TOKEN`.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Codecov upload skipped for fork PR without `CODECOV_TOKEN`; LCOV artifact retained.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::Codecov upload skipped for fork PR without CODECOV_TOKEN'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'use_oidc=true' >> "$GITHUB_OUTPUT"
            echo 'Codecov upload: OIDC (no `CODECOV_TOKEN` set).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Codecov
        if: steps.codecov_token.outputs.available == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust.lcov,coverage/lcov.info
          disable_search: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          fail_ci_if_error: true
          use_oidc: ${{ steps.codecov_token.outputs.use_oidc == 'true' }}
          verbose: true

      - name: Check Qlty coverage upload mode
        id: qlty_coverage
        shell: bash
        env:
          QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Qlty coverage upload skipped for fork PR.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ github.actor }}" = 'dependabot[bot]' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          if [ -n "$QLTY_COVERAGE_TOKEN" ]; then
            echo 'use_oidc=false' >> "$GITHUB_OUTPUT"
            echo 'Qlty coverage upload: repository secret `QLTY_COVERAGE_TOKEN`.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'use_oidc=true' >> "$GITHUB_OUTPUT"
            echo 'Qlty coverage upload: OIDC (no `QLTY_COVERAGE_TOKEN` set).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage to Qlty
        if: steps.qlty_coverage.outputs.enabled == 'true'
        uses: qltysh/qlty-action/coverage@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0
        with:
          oidc: ${{ steps.qlty_coverage.outputs.use_oidc == 'true' }}
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/rust.lcov,coverage/lcov.info
