# Claude Code on GitHub: reply to `@claude` mentions on issues, PRs and reviews.
#
# Runs through the Claude GitHub App, so comments and issues it creates are
# authored by `claude[bot]`, not by a personal account.
#
# Requires, in repo Settings → Secrets and variables → Actions:
#   CLAUDE_CODE_OAUTH_TOKEN   (Claude Max/Pro subscription token from running
#                              `claude setup-token` locally; do not commit it)
# and the Claude GitHub App installed on this repository.
#
# Only repository members, owners and collaborators can trigger it. Third-party
# Actions are pinned to a commit SHA, matching the other workflows in this repo.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # `assigned` is deliberately not a trigger: on that event
  # `issue.author_association` describes the issue author, not the person
  # assigning, so a collaborator assigning an outsider's issue would pass the
  # collaborator check below with attacker-written text.
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege: this workflow files issues and comments, which needs no
    # push access. Raise `contents` to `write` only if you want @claude to push
    # branches and commits.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Required by claude-code-action to exchange the job's OIDC token for the
      # Claude GitHub App token; that exchange is what makes comments and
      # issues show as `claude[bot]`. It grants no access to cloud providers
      # unless a cloud trust policy is configured for this repository.
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm

      # --ignore-scripts keeps dependency install scripts from running with the
      # subscription token in scope.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Claude
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Issue commands, plus the exact `npm run build` but only outside pull
          # requests. For PR events claude-code-action checks out the PR branch
          # (a fork's head included) before Claude runs, so a build there would
          # execute that branch's astro config, loaders and npm scripts with the
          # subscription token in scope. On issue events it works from the
          # default branch. cargo stays disallowed (build.rs, test binaries).
          # The action runs with acceptEdits, so Claude could otherwise rewrite
          # package.json or astro.config.mjs and then run the allowed build;
          # the edit tools are denied (this job has contents: read and nothing
          # to edit), which leaves the build running the default-branch tree.
          claude_args: |
            --model claude-sonnet-5-5
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit"
            --allowedTools "Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*)${{ (github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)) && ',Bash(npm run build)' || '' }}"
