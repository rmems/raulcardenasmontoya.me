# DRAFT — not active. To enable, move this file to .github/workflows/meticulous.yml
# after the steps in docs/meticulous/README.md (GitHub App + METICULOUS_API_TOKEN secret).
# Based on https://app.meticulous.ai/docs/github-actions-v2.md (upload-assets, static site).
name: Meticulous

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      meticulous-commit-sha:
        description: Commit Meticulous has asked this run to build. Defaults to the branch head.
        required: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

env:
  METICULOUS_COMMIT_SHA: ${{ github.event.inputs['meticulous-commit-sha'] || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

jobs:
  test:
    name: Meticulous
    runs-on: ubuntu-latest
    # Secrets are not available to fork PRs; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Ensure base tests exist
        uses: alwaysmeticulous/report-diffs-action/ensure-base@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          ref: ${{ env.METICULOUS_COMMIT_SHA }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.METICULOUS_COMMIT_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          METICULOUS_BUILD: 'true'
        run: npm run build

      - name: Upload dist and run Meticulous
        uses: alwaysmeticulous/report-diffs-action/upload-assets@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          # Astro emits one directory per route (dist/about/index.html, ...) with
          # root-relative /_astro/ assets, so no SPA rewrite is needed.
          app-directory: 'dist'
