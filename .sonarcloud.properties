# Generated wasm-bindgen output (public/wasm/neuromorphic-adapter/) is
# deterministic build output pinned by scripts/build-neuromorphic-web.mjs,
# not hand-maintained source.
sonar.exclusions=public/wasm/**

# src/data holds plain data records that share one shape by design, which
# trips copy-paste detection without any duplicated logic.
sonar.cpd.exclusions=src/data/**
